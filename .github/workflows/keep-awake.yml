# Render's free web service sleeps after 15 idle minutes and takes ~40 s to wake,
# which makes the first request fail. Ping it every 10 minutes to keep it awake.
# (GitHub may delay scheduled runs a little; the app also retries while waking.)
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API health
        run: curl -fsS --max-time 120 --retry 2 https://agri-yield-pro-api.onrender.com/api/health
